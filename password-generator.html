<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator - MiniTools Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="container">

            <h1>MiniTools Hub</h1>

            <p>Simple tools for everyday stuff.</p>

        </div>

    </header>


    <main class="password-page">

        <div class="password-generator">

            <h2>Password Generator</h2>

            <p>Create a random password for your accounts.</p>

            <div class="password-output">

                <input
                    type="text"
                    id="passwordOutput"
                    readonly
                    placeholder="Your password"
                >

                <button onclick="copyPassword()">
                    Copy
                </button>

            </div>


            <div class="password-options">

                <label for="passwordLength">
                    Password Length:
                </label>

                <input
                    type="number"
                    id="passwordLength"
                    min="8"
                    max="50"
                    value="16"
                >

            </div>


            <div class="password-options">

                <label>
                    <input
                        type="checkbox"
                        id="includeNumbers"
                        checked
                    >

                    Include Numbers
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="includeSymbols"
                        checked
                    >

                    Include Symbols
                </label>

            </div>


            <button
                class="generate-button"
                onclick="generatePassword()"
            >
                Generate Password
            </button>

            <p id="copyMessage"></p>

        </div>

    </main>


    <footer class="footer">

        <p>© 2026 MiniTools Hub</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
