<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MiniTools Hub Random Number Generator — generate random numbers instantly."
    >

    <title>Random Number Generator — MiniTools Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="brand">
                <span class="brand-mark">M</span>
                <span>MiniTools<span class="brand-accent">.</span></span>
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="index.html#about">About</a>
            </div>

        </div>
    </nav>

    <main class="tool-page">

        <div class="tool-container">

            <a href="index.html" class="back-link">
                ← Back to Hub
            </a>

            <div class="tool-header">

                <p class="section-label">
                    MINITOOLS / 07
                </p>

                <h1>Random Number Generator</h1>

                <p>
                    Generate a random number between any two values.
                </p>

            </div>

            <div class="simple-tool-card">

                <div class="input-group">

                    <label for="minimum">
                        MINIMUM NUMBER
                    </label>

                    <input
                        type="number"
                        id="minimum"
                        placeholder="1"
                    >

                </div>

                <div class="input-group">

                    <label for="maximum">
                        MAXIMUM NUMBER
                    </label>

                    <input
                        type="number"
                        id="maximum"
                        placeholder="100"
                    >

                </div>

                <button
                    type="button"
                    id="generateButton"
                    class="primary-tool-button"
                >
                    Generate Number
                </button>

                <div
                    id="randomResult"
                    class="tool-result"
                    aria-live="polite"
                >
                    Your random number will appear here
                </div>

            </div>

            <p class="tool-note">
                Everything runs directly in your browser.
            </p>

        </div>

    </main>

    <footer class="footer">

        <div class="footer-container">

            <div class="brand footer-brand">

                <span class="brand-mark">M</span>

                <span>
                    MiniTools<span class="brand-accent">.</span>
                </span>

            </div>

            <p>
                Built with curiosity &amp; code.
            </p>

            <p>
                © 2026 MiniTools Hub
            </p>

        </div>

    </footer>

    <script>

        const minimumInput =
            document.getElementById("minimum");

        const maximumInput =
            document.getElementById("maximum");

        const generateButton =
            document.getElementById("generateButton");

        const randomResult =
            document.getElementById("randomResult");

        generateButton.addEventListener("click", function () {

            if (
                minimumInput.value === "" ||
                maximumInput.value === ""
            ) {
                randomResult.textContent =
                    "Please enter both numbers.";

                return;
            }

            const minimum =
                Number(minimumInput.value);

            const maximum =
                Number(maximumInput.value);

            if (
                !Number.isFinite(minimum) ||
                !Number.isFinite(maximum)
            ) {
                randomResult.textContent =
                    "Please enter valid numbers.";

                return;
            }

            if (minimum > maximum) {
                randomResult.textContent =
                    "Minimum must be smaller than maximum.";

                return;
            }

            const randomNumber =
                Math.floor(
                    Math.random() * (maximum - minimum + 1)
                ) + minimum;

            randomResult.textContent =
                "Random number: " + randomNumber;
        });

    </script>

</body>

</html>
