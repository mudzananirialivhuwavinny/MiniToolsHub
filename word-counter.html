<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MiniTools Hub Word Counter — count words and characters quickly."
    >

    <title>Word Counter — MiniTools Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="brand">
                <span class="brand-mark">M</span>
                <span>MiniTools<span class="brand-accent">.</span></span>
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#tools">
                    Tools
                </a>

                <a href="index.html#about">
                    About
                </a>

            </div>

        </div>

    </nav>


    <!-- Word Counter -->

    <main class="tool-page">

        <div class="tool-container word-counter-container">

            <a href="index.html" class="back-link">
                ← Back to Hub
            </a>

            <div class="tool-header">

                <p class="section-label">
                    MINITOOLS / 02
                </p>

                <h1>Word Counter</h1>

                <p>
                    Count words and characters while you write.
                </p>

            </div>


            <div class="word-counter">

                <div class="counter-stats">

                    <div class="counter-stat">

                        <span class="stat-label">
                            WORDS
                        </span>

                        <span
                            id="wordCount"
                            class="stat-number"
                        >
                            0
                        </span>

                    </div>


                    <div class="counter-stat">

                        <span class="stat-label">
                            CHARACTERS
                        </span>

                        <span
                            id="characterCount"
                            class="stat-number"
                        >
                            0
                        </span>

                    </div>

                </div>


                <textarea
                    id="textInput"
                    placeholder="Start typing or paste your text here..."
                    spellcheck="true"
                ></textarea>

            </div>


            <p class="tool-note">
                Your text stays in your browser.
            </p>

        </div>

    </main>


    <!-- Footer -->

    <footer class="footer">

        <div class="footer-container">

            <div class="brand footer-brand">

                <span class="brand-mark">M</span>

                <span>
                    MiniTools<span class="brand-accent">.</span>
                </span>

            </div>

            <p>
                Built with curiosity &amp; code.
            </p>

            <p>
                © 2026 MiniTools Hub
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
