<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MiniTools Hub QR Generator — create QR codes quickly."
    >

    <title>QR Generator — MiniTools Hub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .qr-output {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
        }

        .qr-output img {
            max-width: 220px;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .qr-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="brand">
                <span class="brand-mark">M</span>
                <span>MiniTools<span class="brand-accent">.</span></span>
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="index.html#about">About</a>
            </div>

        </div>
    </nav>

    <main class="tool-page">

        <div class="tool-container">

            <a href="index.html" class="back-link">
                ← Back to Hub
            </a>

            <div class="tool-header">

                <p class="section-label">
                    MINITOOLS / 06
                </p>

                <h1>QR Generator</h1>

                <p>
                    Turn a website link or text into a QR code.
                </p>

            </div>

            <div class="simple-tool-card">

                <div class="input-group">

                    <label for="qrText">
                        TEXT OR URL
                    </label>

                    <input
                        type="text"
                        id="qrText"
                        placeholder="https://example.com"
                    >

                </div>

                <button
                    type="button"
                    id="generateQR"
                    class="primary-tool-button"
                >
                    Generate QR Code
                </button>

                <div
                    id="qrOutput"
                    class="qr-output"
                ></div>

                <p
                    id="qrMessage"
                    class="qr-message"
                ></p>

            </div>

            <p class="tool-note">
                Everything runs directly in your browser.
            </p>

        </div>

    </main>

    <footer class="footer">

        <div class="footer-container">

            <div class="brand footer-brand">
                <span class="brand-mark">M</span>

                <span>
                    MiniTools<span class="brand-accent">.</span>
                </span>
            </div>

            <p>
                Built with curiosity &amp; code.
            </p>

            <p>
                © 2026 MiniTools Hub
            </p>

        </div>

    </footer>

    <script>
        const qrText = document.getElementById("qrText");
        const generateQR = document.getElementById("generateQR");
        const qrOutput = document.getElementById("qrOutput");
        const qrMessage = document.getElementById("qrMessage");

        generateQR.addEventListener("click", function () {

            const text = qrText.value.trim();

            if (text === "") {
                qrOutput.innerHTML = "";
                qrMessage.textContent = "Please enter some text or a URL.";
                return;
            }

            const encodedText = encodeURIComponent(text);

            const qrUrl =
                "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="
                + encodedText;

            qrOutput.innerHTML =
                '<img src="' + qrUrl + '" alt="Generated QR Code">';

            qrMessage.textContent = "QR code generated!";
        });
    </script>

</body>

</html>
